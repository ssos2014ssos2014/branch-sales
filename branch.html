// ---------- طلب التعديل ----------
const dlg = document.getElementById('corrDlg');
let corrDate = null, CORR = {};
function openCorr(d) {
  const e = map[d]; if (!e) return;
  corrDate = d;
  document.getElementById('corrErr').textContent = '';
  // في الفروع الآجلة: الخانتان معبأتان بالمسجل، يغيّر الموظف ما يحتاج تعديله فقط
  document.getElementById('corrAmount').value = info.credit ? String(Number(e.amount)) : '';
  if (info.credit) {
    const v = { cash: Number(e.cash) || 0, bank: Number(e.bank) || 0, card: Number(e.card) || 0 };
    const other = Number(e.collected) - paySum(v);
    if (other > 0.004) v.cash += other;   // التحصيل القديم بدون تفصيل يُعرض في النقدي ليعدّله الموظف
    CORR = {}; for (const k of PAY_KEYS) CORR[k] = v[k] ? String(Math.round(v[k] * 100) / 100) : '';
    const box = document.getElementById('corrPay'); box.innerHTML = payFields('c', CORR); bindPay(box, 'c', CORR);
  }
  document.getElementById('corrColWrap').hidden = !info.credit;
  const spS = document.getElementById('corrSpS'), spC = document.getElementById('corrSpC');
  spS.innerHTML = ''; spC.innerHTML = '';
  if (hasAcc()) {
    if (!info.credit) document.getElementById('corrAmount').value = String(Number(e.amount));
    CSPL = { s: splitObj(e.split), c: splitObj(e.col_split) };
    const ca = () => parseAmount(document.getElementById('corrAmount').value), cc = () => paySum(payVals(CORR));
    spS.innerHTML = splitHtml('cs', CSPL.s, 'توزيع المبيعات على الفروع', 'قيمة فاتورة كل فرع');
    bindSplit(spS, 'cs', CSPL.s, ca, 'المبيعات');
    document.getElementById('corrAmount').oninput = () => splitCalc(spS, 'cs', ca(), CSPL.s, 'المبيعات');
    if (info.credit) {
      spC.innerHTML = splitHtml('cc', CSPL.c, 'توزيع التحصيل على الفروع', 'المبلغ المحصّل من كل فرع');
      bindSplit(spC, 'cc', CSPL.c, cc, 'التحصيل');
      const box = document.getElementById('corrPay'); bindPay(box, 'c', CORR, () => splitCalc(spC, 'cc', cc(), CSPL.c, 'التحصيل'));
    }
  } else document.getElementById('corrAmount').oninput = null;
  document.getElementById('corrAmountLbl').textContent = info.credit ? 'المبيعات الصحيحة (آجل)' : 'المبلغ الصحيح';
  document.getElementById('corrNote').value = '';
  const send = document.getElementById('corrSend');
  const admNote = e.by === 'admin' ? '<p class="adm-note">تم إدخال مبيعات هذا اليوم من قبل الإدارة.</p>' : '';
  const recorded = info.credit
    ? `المبيعات المسجلة: <b class="num">${money(e.amount)}</b> ريال<br>التحصيل المسجل: <b class="num">${money(e.collected)}</b> ريال${Number(e.collected) ? `<br><small>${esc(entryPay(e))}</small>` : ''}`
    : `المبلغ المسجل: <b class="num">${money(e.amount)}</b> ريال`;
  if (e.pending) {
    document.getElementById('corrInfo').innerHTML = `${esc(fmtLong(d))}<br>يوجد طلب تعديل لهذا اليوم بانتظار الإدارة.${admNote}`;
    send.disabled = true;
  } else {
    document.getElementById('corrInfo').innerHTML = `${esc(fmtLong(d))}<br>${recorded}${admNote}<span style="display:block;margin-top:8px">${info.credit ? 'عدّل الرقم غير الصحيح وأرسل طلب تعديل.' : 'إذا كان المبلغ غير صحيح اكتب المبلغ الصحيح وأرسل طلب تعديل.'}</span>`;
    send.disabled = false;
  }
  dlg.showModal();
  if (!e.pending) setTimeout(() => document.getElementById('corrAmount').focus(), 50);
}
document.getElementById('corrCancel').onclick = () => dlg.close();
document.getElementById('corrForm').onsubmit = async ev => {
  ev.preventDefault();
  const errEl = document.getElementById('corrErr');
  const amt = parseAmount(document.getElementById('corrAmount').value);
  if (isNaN(amt)) { errEl.textContent = 'اكتب المبلغ الصحيح رقماً فقط'; return; }
  const args = { p_token: token, p_date: corrDate, p_new_amount: amt, p_note: document.getElementById('corrNote').value };
  if (info.credit) {
    const v = payVals(CORR), bad = PAY_KEYS.find(k => isNaN(v[k]));
    if (bad) { errEl.textContent = `اكتب مبلغ ${PAY_LBL[bad]} رقماً فقط`; return; }
    args.p_new_collected = paySum(v); args.p_new_cash = v.cash; args.p_new_bank = v.bank; args.p_new_card = v.card;
  }
  if (hasAcc()) {
    const a = splitCalc(document.getElementById('corrSpS'), 'cs', amt, CSPL.s, 'المبيعات'); if (!a.ok) { errEl.textContent = a.msg; return; }
    args.p_new_split = splitArg(a.vals);
    if (info.credit) { const c = splitCalc(document.getElementById('corrSpC'), 'cc', args.p_new_collected, CSPL.c, 'التحصيل'); if (!c.ok) { errEl.textContent = c.msg; return; } args.p_new_col_split = splitArg(c.vals); }
  }
  const send = document.getElementById('corrSend'); send.disabled = true; send.textContent = 'جارٍ الإرسال…';
  const { error } = await sb.rpc('request_correction', args);
  send.disabled = false; send.textContent = 'إرسال طلب التعديل';
  if (error) { errEl.textContent = errMsg(error); return; }
  dlg.close(); toast('أُرسل طلب التعديل إلى الإدارة'); await load();
};

// =====================================================================
//  البضائع التالفة
// =====================================================================
const W = { other: { open: false, name: '', unit: 'piece', cost: '', cat: '' }, date: null, basket: [], step: 'form', search: '', month: null, recs: [], loaded: false, loading: false, last: null, pdf: null, preparing: false };
const itemOf = id => (info.items || []).find(i => i.id === id);
// ترتيب الأصناف: حسب التصنيف، ثم نوع الصنف، ثم الحجم (كبير ← مستطيل ← وسط ← صغير)
const CATS = ['البسبوسة', 'الكيك والتشيز', 'المعجنات', 'الخلايا والكرواسون', 'التمور', 'ورق العنب', 'الشوكولاتة', 'البيتفور والمعمول', 'البقلاوة والحلويات الشرقية', 'أخرى'];
const catOf = i => (i.category || 'أخرى').trim() || 'أخرى';
// لون مميز لكل قسم من أقسام التوالف (الأقسام الجديدة تأخذ لوناً ثابتاً من القائمة)
const CAT_COL = { 'البسبوسة': '#8f5d0a', 'الكيك والتشيز': '#a83a64', 'المعجنات': '#8a5524', 'الخلايا والكرواسون': '#5e7020', 'التمور': '#7a3a1f',
  'ورق العنب': '#3d7330', 'الشوكولاتة': '#4a2a1e', 'البيتفور والمعمول': '#23706b', 'البقلاوة والحلويات الشرقية': '#5b3ea0', 'أخرى': '#5b6270' };
const CAT_EXTRA = ['#2e5f8a', '#8a2e5f', '#6a5a12', '#2e7a55', '#7a4a8a'];
function catColor(c) { if (CAT_COL[c]) return CAT_COL[c]; let h = 0; for (const ch of c) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return CAT_EXTRA[h % CAT_EXTRA.length]; }
const catOrder = () => (info && info.cats && info.cats.length ? info.cats : CATS);
const catRank = c => { const o = catOrder(), k = o.indexOf(c); return k < 0 ? (c === 'أخرى' ? 1e6 : o.length + 0.5) : k; };
const ordRank = i => i.sort_order == null ? 1e9 : Number(i.sort_order);
const SIZE_RE = /\s+(كبير|مستطيل|وسط|صغير|ربع)(\s.*)?$/;
const sizeRank = n => /كبير/.test(n) ? 1 : /مستطيل/.test(n) ? 2 : /وسط/.test(n) ? 3 : /(صغير|ربع)/.test(n) ? 4 : 5;
const baseName = n => n.replace(SIZE_RE, '');
function sortItems(list) {
  return list.slice().sort((a, b) => catRank(catOf(a)) - catRank(catOf(b)) || catOf(a).localeCompare(catOf(b), 'ar')
    || ordRank(a) - ordRank(b)
    || baseName(a.name).localeCompare(baseName(b.name), 'ar') || sizeRank(a.name) - sizeRank(b.name) || a.name.localeCompare(b.name, 'ar'));
}
const r2 = n => Math.round(n * 100) / 100;
const unitName = u => u === 'weight' ? 'كيلو' : 'حبة';

// رقم صحيح من نص (يقبل الأرقام العربية)، الفارغ = emptyVal
function toInt(s, emptyVal) {
  if (String(s ?? '').trim() === '') return emptyVal;
  const n = parseAmount(s);
  return Number.isInteger(n) ? n : NaN;
}
// الكيلو بالفاصلة: "1.5" أو "1,5" أو "١٫٥" = كيلو ونص (حتى 3 أرقام بعد الفاصلة)
function parseKg(s) {
  s = String(s ?? '').trim()
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٫,،]/g, '.').replace(/\s/g, '');
  if (s === '') return 0;
  if (/^\.\d/.test(s)) s = '0' + s;
  if (!/^\d+(\.\d{0,3})?$/.test(s)) return NaN;
  return Number(s);
}
const fmtKgNum = n => (Math.round(n * 1000) / 1000).toString();
// الكمية: الحبة بالعدد، والوزن يُرسل بالجرام (الكيلو × 1000)
function lineQty(l) {
  const it = itemOf(l.id); if (!it) return NaN;
  if (it.unit === 'piece') return toInt(l.n, 0);
  const kg = parseKg(l.kg);
  return isNaN(kg) ? NaN : Math.round(kg * 1000);
}
function lineCost(l) {
  const it = itemOf(l.id), q = lineQty(l);
  if (!it || isNaN(q)) return 0;
  return r2(it.unit === 'weight' ? q / 1000 * Number(it.cost) : q * Number(it.cost));
}
function fmtQty(unit, q) {
  q = Number(q);
  if (unit === 'piece') return `${money(q)} حبة`;
  return `${KG.format(q / 1000)} كيلو`;
}
const KG = new Intl.NumberFormat('en-US', { maximumFractionDigits: 3 });
const countItems = n => n === 1 ? 'صنف واحد' : n === 2 ? 'صنفان' : n <= 10 ? `${n} أصناف` : `${n} صنفاً`;
const basketTotal = () => r2(W.basket.reduce((a, l) => a + lineCost(l), 0));

// ---------- نموذج الإدخال ----------
function renderWForm() {
  const el = document.getElementById('wform'); if (!el) return;
  if (!W.date) W.date = info.today;
  const items = info.items || [];

  if (W.step === 'done') {
    const L = W.last;
    el.innerHTML = `<div class="done-box"><div class="tick">✓</div>
      <h2 style="font-size:20px">تم إرسال البضائع التالفة</h2>
      <p class="muted" style="margin:4px 0 16px">${esc(fmtLong(L.date))}: ${countItems(L.lines.length)} بتكلفة <b class="num">${money(L.total)}</b> ريال</p>
      <div class="stack">
        <button class="btn btn-wa btn-block btn-lg" id="waShare">إرسال تقرير PDF على قروب الواتساب</button>
        <p class="muted" id="pdfState" style="font-size:13px">${W.pdf ? 'التقرير جاهز' : 'جارٍ تجهيز التقرير…'}</p>
        ${info.waste_link ? `<a class="btn btn-ghost btn-block" href="${esc(info.waste_link)}" target="_blank" rel="noopener">فتح قروب التوالف</a>` : ''}
        <button class="btn btn-ghost btn-block" id="wAgain">إدخال جديد</button>
      </div></div>`;
    el.querySelector('#wAgain').onclick = () => { W.step = 'form'; W.pdf = null; renderWForm(); };
    el.querySelector('#waShare').onclick = e => sharePrepared(e.currentTarget, () => buildPdf({ batch: W.last, recs: W.recs, month: W.month }));
    return;
  }

  if (W.step === 'confirm') {
    el.innerHTML = `<div class="confirm">
      <p class="muted">راجع قبل الإرسال</p>
      <p style="font-weight:600;margin-top:6px">${esc(fmtLong(W.date))}</p>
      <div class="clist">${W.basket.map(l => { const it = itemOf(l.id);
        return `<div><span>${esc(it.name)} <span class="muted">(${esc(fmtQty(it.unit, lineQty(l)))})</span></span><b>${money(lineCost(l))}</b></div>`; }).join('')}</div>
      <div class="w-total"><span>إجمالي التكلفة</span><b>${money(basketTotal())} <span class="cur">ريال</span></b></div>
      <p class="warn">بعد الإرسال لا يمكن تعديل الإدخال. إذا أخطأت تواصل مع الإدارة.</p>
      <div class="row2">
        <button class="btn btn-accent btn-lg" id="wSend">تأكيد الإرسال</button>
        <button class="btn btn-ghost btn-lg" id="wBack">رجوع</button>
      </div></div>`;
    el.querySelector('#wBack').onclick = () => { W.step = 'form'; renderWForm(); };
    el.querySelector('#wSend').onclick = submitWaste;
    return;
  }

  el.innerHTML = `
    <div class="w-head"><h2>إدخال البضائع التالفة</h2>
      <label class="muted" style="font-size:14px">التاريخ <input type="date" id="wDate" max="${info.today}" value="${W.date}"></label></div>
    ${items.length > 8 ? `<input class="w-search" id="wSearch" placeholder="ابحث عن صنف" value="${esc(W.search)}">` : ''}
    <p class="w-hint">${items.length ? 'اختر الصنف التالف، وإذا لم تجده اضغط "صنف آخر"' : 'لا توجد أصناف بعد. اضغط "صنف آخر" لإضافة صنف'}</p>
    <div class="chips" id="chips"></div>
    <div id="wlines"></div>
    <div class="w-total"><span>إجمالي التكلفة</span><b><span id="wTotal">${money(basketTotal())}</span> <span class="cur">ريال</span></b></div>
    <p class="err" id="wErr" role="alert"></p>
    <button class="btn btn-primary btn-block btn-lg" id="wNext">إرسال التوالف</button>`;
  el.querySelector('#wDate').onchange = e => { W.date = e.target.value; };
  const s = el.querySelector('#wSearch'); if (s) s.oninput = () => { W.search = s.value; renderChips(); };
  el.querySelector('#wNext').onclick = () => {
    const err = el.querySelector('#wErr');
    W.date = el.querySelector('#wDate').value;
    if (!W.date) { err.textContent = 'اختر التاريخ'; return; }
    if (W.date > info.today) { err.textContent = 'لا يمكن الإدخال لتاريخ لم يأتِ بعد'; return; }
    if (!W.basket.length) { err.textContent = 'اختر صنفاً واحداً على الأقل'; return; }
    for (const l of W.basket) {
      const it = itemOf(l.id), q = lineQty(l);
      if (isNaN(q)) { err.textContent = it.unit === 'weight' ? `اكتب الوزن بالكيلو للصنف: ${it.name}، مثل 1.5 لكيلو ونص` : `اكتب العدد رقماً صحيحاً للصنف: ${it.name}`; return; }
      if (q <= 0) { err.textContent = `اكتب الكمية للصنف: ${it.name}، أو احذفه`; return; }
    }
    W.step = 'confirm'; renderWForm();
  };
  renderChips(); renderLines();
}

// ---------- صنف آخر: الموظف يكتب الاسم والتكلفة فيُضاف لقائمة الأصناف رسمياً ----------
function otherFormHtml() {
  const o = W.other, w = o.unit === 'weight';
  return `<div class="other-form" id="otherForm">
    <label class="field"><span>اسم الصنف</span><input id="oName" autocomplete="off" value="${esc(o.name)}" maxlength="80"></label>
    <div class="field"><span>نوع الصنف</span><div class="unit-seg">
      <button type="button" data-ounit="piece" aria-pressed="${!w}">بالحبة</button>
      <button type="button" data-ounit="weight" aria-pressed="${w}">بالوزن</button></div></div>
    <label class="field"><span>القسم</span><select id="oCat"><option value="">تلقائي حسب الاسم</option>${[...new Set([...catOrder(), ...(info.items || []).map(catOf)])].map(c => `<option${c === o.cat ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
    <label class="field"><span>${w ? 'سعر تكلفة 1 كيلو (ريال)' : 'سعر تكلفة الحبة (ريال)'}</span>
      <input id="oCost" inputmode="decimal" autocomplete="off" dir="ltr" value="${esc(o.cost)}" placeholder="0"></label>
    <p class="err" id="oErr" role="alert"></p>
    <div class="row2"><button type="button" class="btn btn-primary" id="oAdd">إضافة الصنف</button>
      <button type="button" class="btn btn-ghost" id="oCancel">إلغاء</button></div>
  </div>`;
}
function bindOther(box) {
  box.querySelector('#otherChip').onclick = () => {
    W.other.open = !W.other.open; renderChips();
    if (W.other.open) document.getElementById('oName').focus();
  };
  if (!W.other.open) return;
  const nm = box.querySelector('#oName'), cs = box.querySelector('#oCost');
  nm.oninput = () => { W.other.name = nm.value; };
  cs.oninput = () => { W.other.cost = cs.value; };
  box.querySelector('#oCat').onchange = e => { W.other.cat = e.target.value; };
  box.querySelectorAll('[data-ounit]').forEach(b => b.onclick = () => { W.other.unit = b.dataset.ounit; renderChips(); });
  box.querySelector('#oCancel').onclick = () => { W.other = { open: false, name: '', unit: 'piece', cost: '', cat: '' }; renderChips(); };
  box.querySelector('#oAdd').onclick = addOtherItem;
  cs.onkeydown = e => { if (e.key === 'Enter') addOtherItem(); };
}
async function addOtherItem() {
  const err = document.getElementById('oErr'), o = W.other;
  const name = o.name.trim().replace(/\s+/g, ' '), cost = parseAmount(o.cost);
  if (!name) { err.textContent = 'اكتب اسم الصنف'; return; }
  if (isNaN(cost)) { err.textContent = 'اكتب سعر التكلفة رقماً فقط، مثل 12.5'; return; }
  const btn = document.getElementById('oAdd'); btn.disabled = true; btn.textContent = 'جارٍ الإضافة…';
  const { data, error } = await sb.rpc('branch_add_item', { p_token: token, p_name: name, p_unit: o.unit, p_cost: cost, p_category: o.cat || '' });
  if (error) { btn.disabled = false; btn.textContent = 'إضافة الصنف'; err.textContent = errMsg(error); return; }
  const item = { id: data.id, name: data.name, unit: data.unit, cost: data.cost, category: data.category };
  if (!itemOf(item.id)) { info.items.push(item); info.items = sortItems(info.items); }
  if (!W.basket.some(l => l.id === item.id)) W.basket.push({ id: item.id, n: '1', kg: '0' });
  W.other = { open: false, name: '', unit: 'piece', cost: '', cat: '' };
  if (!document.getElementById('chips')) { renderWForm(); } else { renderChips(); renderLines(); document.getElementById('wTotal').textContent = money(basketTotal()); }
  toast(data.existed ? `الصنف "${item.name}" موجود في القائمة وتمت إضافته للإدخال` : `تمت إضافة "${item.name}" إلى قائمة الأصناف`);
}

function renderChips() {
  const box = document.getElementById('chips'); if (!box) return;
  const q = W.search.trim();
  const list = sortItems((info.items || []).filter(i => !q || i.name.includes(q)));
  // الصنف المختار يتحول في مكانه إلى خانة الكمية (بدون النزول لأسفل الصفحة)
  const chip = i => { const l = W.basket.find(x => x.id === i.id); return l ? lineHtml(l)
    : `<button type="button" class="chip" data-item="${i.id}">${esc(i.name)}<small>${i.unit === 'weight' ? 'وزن' : 'حبة'}</small></button>`; };
  // بدون بحث: الأصناف في مجموعات حسب التصنيف | مع البحث: قائمة واحدة
  let html = '';
  if (q) html = list.map(chip).join('') || '<p class="muted" style="font-size:14px">لا يوجد صنف بهذا الاسم</p>';
  else {
    const groups = [];
    for (const i of list) { const c = catOf(i); let g = groups.find(x => x.c === c); if (!g) groups.push(g = { c, items: [] }); g.items.push(i); }
    W.closed = W.closed || new Set();
    html = groups.map(g => {
      const sel = g.items.filter(i => W.basket.some(l => l.id === i.id)).length, shut = W.closed.has(g.c);
      return `<section class="chip-group${shut ? ' shut' : ''}" style="--cc:${catColor(g.c)}">
        <button type="button" class="chip-cat" data-gcat="${esc(g.c)}" aria-expanded="${!shut}">
          <span class="cc-name">${esc(g.c)}</span>
          ${sel ? `<span class="cc-sel">${sel} مختار</span>` : ''}
          <span class="cc-n">${g.items.length} صنف</span>
          <span class="cc-arr" aria-hidden="true">▾</span></button>
        ${shut ? '' : `<div class="chip-row">${g.items.map(chip).join('')}</div>`}</section>`;
    }).join('');
  }
  box.innerHTML = html
    + `<button type="button" class="chip chip-other${W.other.open ? ' on' : ''}" id="otherChip">+ صنف آخر</button>`
    + (W.other.open ? otherFormHtml() : '');
  bindOther(box);
  box.querySelectorAll('[data-gcat]').forEach(b => b.onclick = () => { const c = b.dataset.gcat; W.closed.has(c) ? W.closed.delete(c) : W.closed.add(c); renderChips(); });
  box.querySelectorAll('.wline').forEach(bindLine);
  box.querySelectorAll('[data-item]').forEach(b => b.onclick = () => {
    const id = Number(b.dataset.item);
    if (!W.basket.some(x => x.id === id)) W.basket.push({ id, n: '1', kg: '0' });
    const top = b.getBoundingClientRect().top;
    renderChips(); renderLines(); updTotal();
    const row = document.querySelector(`#chips .wline[data-id="${id}"]`);
    if (row) {
      window.scrollBy(0, row.getBoundingClientRect().top - top);   // يبقى الصنف في نفس مكانه على الشاشة
      const inp = row.querySelector('input'); inp.focus({ preventScroll: true }); inp.select();
    }
  });
}

function lineHtml(l) {
  const it = itemOf(l.id); if (!it) return '';
  const qty = it.unit === 'piece'
    ? `<div class="qty-box"><span>العدد</span><div class="stepper">
         <button type="button" data-step="n" data-d="1" aria-label="زيادة">+</button>
         <input data-f="n" inputmode="numeric" autocomplete="off" value="${esc(l.n)}" placeholder="0" aria-label="العدد">
         <button type="button" data-step="n" data-d="-1" aria-label="إنقاص">−</button></div></div>`
    : `<div class="qty-box"><span>الوزن بالكيلو</span><div class="stepper kg">
         <button type="button" data-step="kg" data-d="1" aria-label="زيادة كيلو">+</button>
         <input data-f="kg" inputmode="decimal" autocomplete="off" value="${esc(l.kg)}" placeholder="0" aria-label="الوزن بالكيلو">
         <button type="button" data-step="kg" data-d="-1" aria-label="إنقاص كيلو">−</button></div>
         <small class="kg-hint">مثال: 1.5 = كيلو ونص، 0.25 = ربع كيلو</small></div>`;
  return `<div class="wline" data-id="${l.id}">
    <div class="wline-top"><div><b>${esc(it.name)}</b><small>${money(it.cost)} ريال / ${unitName(it.unit)}</small></div>
      <button type="button" class="x" data-rm="${l.id}" aria-label="إلغاء اختيار ${esc(it.name)}">×</button></div>
    <div class="qty-row">${qty}<div class="line-cost"><span>التكلفة</span><b class="lc">${money(lineCost(l))}</b></div></div>
  </div>`;
}
function updTotal() { const t = document.getElementById('wTotal'); if (t) t.textContent = money(basketTotal()); const e = document.getElementById('wErr'); if (e) e.textContent = ''; }
function bindLine(row) {
  const l = W.basket.find(x => x.id === Number(row.dataset.id)); if (!l) return;
  const upd = () => { row.querySelector('.lc').textContent = money(lineCost(l)); updTotal(); renderLines(); };
  row.querySelectorAll('input[data-f]').forEach(inp => {
    inp.oninput = () => { l[inp.dataset.f] = inp.value; upd(); };
    inp.onfocus = () => { if (inp.value === '0') inp.select(); };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } };
  });
  row.querySelectorAll('[data-step]').forEach(btn => btn.onclick = () => {
    const f = btn.dataset.step, cur = f === 'kg' ? parseKg(l[f]) : toInt(l[f], 0);
    const v = Math.max(0, (isNaN(cur) ? 0 : cur) + Number(btn.dataset.d));
    l[f] = f === 'kg' ? fmtKgNum(v) : String(v); row.querySelector(`input[data-f="${f}"]`).value = l[f]; upd();
  });
  row.querySelector('[data-rm]').onclick = () => {
    const top = row.getBoundingClientRect().top;
    W.basket = W.basket.filter(x => x !== l); renderChips(); renderLines(); updTotal();
    const chip = document.querySelector(`#chips [data-item="${l.id}"]`);
    if (chip) window.scrollBy(0, chip.getBoundingClientRect().top - top);
  };
}
// ملخص صغير فوق زر الإرسال بالأصناف المختارة (الإدخال نفسه يتم داخل القسم)
function renderLines() {
  const box = document.getElementById('wlines'); if (!box) return;
  if (!W.basket.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="w-sum"><p>الأصناف المختارة (${W.basket.length})</p>${W.basket.map(l => { const it = itemOf(l.id); if (!it) return '';
      const q = lineQty(l); return `<button type="button" class="w-sum-i" data-goto="${l.id}"><span>${esc(it.name)}</span><b>${isNaN(q) || q <= 0 ? '<i class="no">حدد الكمية</i>' : esc(fmtQty(it.unit, q))}</b></button>`; }).join('')}</div>`;
  box.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => {
    const id = Number(b.dataset.goto), it = itemOf(id);
    let row = document.querySelector(`#chips .wline[data-id="${id}"]`);
    if (!row) { W.search = ''; const s = document.getElementById('wSearch'); if (s) s.value = ''; if (W.closed && it) W.closed.delete(catOf(it)); renderChips(); row = document.querySelector(`#chips .wline[data-id="${id}"]`); }
    if (row) { row.scrollIntoView({ block: 'center', behavior: 'smooth' }); row.querySelector('input').focus({ preventScroll: true }); }
  });
}

async function submitWaste() {
  if (busy) return; busy = true;
  const btn = document.getElementById('wSend'); btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
  const lines = W.basket.map(l => ({ item_id: l.id, qty: lineQty(l) }));
  const { data, error } = await sb.rpc('submit_waste', { p_token: token, p_date: W.date, p_lines: lines });
  busy = false;
  if (error) { toast(errMsg(error), 'err'); W.step = 'form'; await load(); return; }
  W.last = {
    batch: data.batch_id, date: W.date, total: Number(data.total),
    lines: W.basket.map(l => { const it = itemOf(l.id); return { item: it.name, unit: it.unit, qty: lineQty(l), unit_cost: Number(it.cost), cost: lineCost(l) }; })
  };
  W.basket = []; W.search = ''; W.step = 'done'; W.pdf = null;
  W.month = monthStart(W.last.date);
  renderWForm();
  await loadWaste();
  // تجهيز التقرير مسبقاً حتى تفتح المشاركة فوراً عند الضغط
  W.preparing = true;
  try { W.pdf = await buildPdf({ batch: W.last, recs: W.recs, month: W.month }); } catch (e) { console.error(e); }
  W.preparing = false;
  const st = document.getElementById('pdfState'); if (st) st.textContent = W.pdf ? 'التقرير جاهز، اضغط الزر لإرساله' : 'تعذّر تجهيز التقرير، اضغط الزر للمحاولة مرة أخرى';
}

// ---------- تقرير الفرع ----------
async function loadWaste() {
  if (!W.month) W.month = monthStart(info.today);
  W.loading = true;
  const m = W.month;
  const { data, error } = await sb.rpc('branch_waste', { p_token: token, p_from: m, p_to: monthEnd(m) });
  W.loading = false;
  if (m !== W.month) return;
  if (error) { toast(errMsg(error), 'err'); return; }
  W.recs = data || []; W.loaded = true;
  renderWRep();
}

function byItem(recs) {
  const map = {};
  for (const r of recs) {
    const k = r.item + '|' + r.unit;
    (map[k] = map[k] || { item: r.item, unit: r.unit, qty: 0, cost: 0, unit_cost: 0 });
    map[k].qty += Number(r.qty); map[k].cost += Number(r.cost); map[k].unit_cost = Number(r.unit_cost) || map[k].unit_cost;
  }
  return Object.values(map).sort((a, b) => b.cost - a.cost);
}
function byDay(recs) {
  const map = {};
  for (const r of recs) (map[r.date] = map[r.date] || []).push(r);
  return Object.keys(map).sort().map(d => ({ date: d, items: byItem(map[d]), total: r2(map[d].reduce((a, r) => a + Number(r.cost), 0)) }));
}

function renderWRep() {
  const el = document.getElementById('wrep'); if (!el) return;
  if (!W.month) W.month = monthStart(info.today);
  const atCurrent = W.month >= monthStart(info.today);
  const head = `<div class="cal-head">
      <button class="nav" id="wPrev" aria-label="الشهر السابق">›</button>
      <h2>تقرير التوالف: ${esc(fmtMonth(W.month))}</h2>
      <button class="nav" id="wNextM" aria-label="الشهر التالي" ${atCurrent ? 'disabled' : ''}>‹</button></div>`;
  let body;
  if (!W.loaded) body = `<p class="muted" style="margin-top:12px">جارٍ التحميل…</p>`;
  else if (!W.recs.length) body = `<p class="muted" style="margin-top:12px">لا توجد توالف مسجلة في هذا الشهر.</p>`;
  else {
    const total = r2(W.recs.reduce((a, r) => a + Number(r.cost), 0));
    const items = byItem(W.recs), days = byDay(W.recs);
    body = `
      <div class="rep-sum"><div class="main"><span>إجمالي تكلفة التوالف</span><b>${money(total)}</b></div>
        <div><span>أيام فيها توالف</span><b>${days.length}</b></div></div>
      <h3>حسب الأصناف (الأعلى تكلفة أولاً)</h3>
      ${items.map(i => `<div class="rank"><div class="rank-top"><span>${esc(i.item)}<small>${esc(fmtQty(i.unit, i.qty))}</small></span><b>${money(i.cost)}</b></div>
        <div class="bar"><i style="width:${total ? i.cost / total * 100 : 0}%"></i></div></div>`).join('')}
      <h3>حسب الأيام</h3>
      ${days.slice().reverse().map(d => `<div class="wday"><div class="wday-h"><span>${esc(fmtShort(d.date))} <span class="muted" style="font-weight:400">${esc(fmtDayName(d.date))}</span></span><b>${money(d.total)}</b></div>
        ${d.items.map(i => `<div class="wday-l"><span>${esc(i.item)} (${esc(fmtQty(i.unit, i.qty))})</span><span class="num">${money(i.cost)}</span></div>`).join('')}</div>`).join('')}
      <button class="btn btn-ghost btn-block" id="monthPdf" style="margin-top:14px">مشاركة تقرير الشهر PDF</button>`;
  }
  el.innerHTML = head + body;
  el.querySelector('#wPrev').onclick = () => { W.month = addMonths(W.month, -1); W.loaded = false; renderWRep(); loadWaste(); };
  el.querySelector('#wNextM').onclick = () => { W.month = addMonths(W.month, 1); W.loaded = false; renderWRep(); loadWaste(); };
  const mp = el.querySelector('#monthPdf');
  if (mp) { let prepared = null; mp.onclick = () => sharePrepared(mp, () => buildPdf({ recs: W.recs, month: W.month }), () => prepared, f => prepared = f); }
}

// ---------- PDF ----------
const PDF_LIBS = [
  'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
  'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'
];
function loadScript(src) {
  return new Promise((ok, bad) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => bad(new Error('تعذّر تحميل أداة التقرير. تحقق من الإنترنت.'));
    document.head.appendChild(s);
  });
}
const branchLabel = () => info.group_name === info.name ? info.name : `${info.group_name} - ${info.name}`;

const pdfCat = name => { const it = (info.items || []).find(x => x.name === name); return it ? catOf(it) : ''; };
const shortNum = n => { n = Math.round(Number(n) || 0); return n >= 10000 ? (Math.round(n / 100) / 10) + 'k' : String(n); };
// أعمدة أفقية: كل صف فيه اسم الصنف وسعر الوحدة والكمية وإجمالي المبلغ
function pdfItemBars(items, opt = {}) {
  const max = Math.max(1, ...items.map(i => i.cost)), total = items.reduce((a, i) => a + i.cost, 0);
  return `<div class="pb-list${opt.top ? ' top' : ''}">${items.map((i, k) => `<div class="pb-row pdf-block">
      ${opt.top ? `<span class="pb-rank">${k + 1}</span>` : ''}
      <div class="pb-lbl"><b>${esc(i.item)}</b><small>سعر ${unitName(i.unit) === 'كيلو' ? 'الكيلو' : 'الحبة'} ${money(i.unit_cost)} · التالف ${esc(fmtQty(i.unit, i.qty))}</small></div>
      <div class="pb-track"><i style="width:${Math.max(1.5, i.cost / max * 100)}%"></i></div>
      <div class="pb-val"><b>${money(i.cost)}</b><small>${total ? (i.cost / total * 100).toFixed(1) : 0}%</small></div></div>`).join('')}</div>`;
}
// أعمدة رأسية: قيمة التوالف لكل يوم من الشهر حتى اليوم
function pdfDayCols(recs, month) {
  const end = month === monthStart(info.today) ? info.today : monthEnd(month);
  const tot = {}; for (const r of recs) tot[r.date] = (tot[r.date] || 0) + Number(r.cost);
  const days = []; for (let d = month; d <= end; d = addDays(d, 1)) days.push(d);
  const max = Math.max(1, ...days.map(d => tot[d] || 0));
  return `<div class="pc-wrap pdf-block"><div class="pc-cols">${days.map(d => { const v = tot[d] || 0;
      return `<div class="pc-col"><span class="pc-v">${v ? shortNum(v) : ''}</span><i style="height:${v ? Math.max(2, v / max * 100) : 0}%"></i><span class="pc-d">${Number(d.slice(8))}</span></div>`; }).join('')}</div>
    <p class="pc-cap">قيمة التوالف لكل يوم (ريال) — الأرقام أسفل الأعمدة هي أيام الشهر</p></div>`;
}
function pdfHtml({ batch, recs, month }) {
  const now = new Intl.DateTimeFormat(AR, { timeZone: TZ, day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date());
  const total = r2(recs.reduce((a, r) => a + Number(r.cost), 0));
  const items = byItem(recs), days = byDay(recs);
  const upTo = month === monthStart(info.today) ? ` حتى ${fmtShort(info.today)}` : '';
  const dayRecs = batch ? recs.filter(r => r.date === batch.date) : [];
  const dayTotal = r2(dayRecs.reduce((a, r) => a + Number(r.cost), 0));
  const timeOf = at => at ? new Intl.DateTimeFormat(AR, { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(new Date(at)) : '';
  let h = `<div class="pdf-head pdf-block">
      ${info.logo ? `<img src="${esc(info.logo)}" alt="">` : ''}
      <div><h1>${esc(branchLabel())}</h1><p class="t">تقرير البضائع التالفة${batch ? ' اليومي' : ''}</p><p>${batch ? esc(fmtLong(batch.date)) : `شهر ${esc(fmtMonth(month))}${esc(upTo)}`}</p></div>
      <div class="meta">تاريخ الإصدار<br>${esc(now)}</div></div>
    <div class="pdf-tot pdf-block">
      ${batch ? `<div class="main"><span>توالف يوم ${esc(fmtShort(batch.date))}</span><b>${money(dayTotal)} ريال</b></div>
        <div><span>أصناف هذا اليوم</span><b>${byItem(dayRecs).length}</b></div>
        <div><span>إجمالي الشهر${esc(upTo)}</span><b>${money(total)} ريال</b></div>`
      : `<div class="main"><span>إجمالي تكلفة التوالف للشهر</span><b>${money(total)} ريال</b></div>
        <div><span>أيام فيها توالف</span><b>${days.length}</b></div>
        <div><span>عدد الأصناف</span><b>${items.length}</b></div>`}</div>`;
  if (batch) {
    h += `<h2 class="pdf-block">توالف يوم ${esc(fmtLong(batch.date))} بالتفصيل</h2>
      <table><thead><tr><th class="n">#</th><th>الصنف</th><th>القسم</th><th class="n">سعر الوحدة</th><th>الكمية</th><th class="n">التكلفة</th><th>وقت الإرسال</th></tr></thead><tbody>
      ${dayRecs.map((r, k) => `<tr${r.batch === batch.batch ? '' : ' class="old"'}><td class="n">${k + 1}</td><td><b>${esc(r.item)}</b></td><td>${esc(pdfCat(r.item))}</td>
        <td class="n">${money(r.unit_cost)} / ${unitName(r.unit)}</td><td>${esc(fmtQty(r.unit, r.qty))}</td><td class="n">${money(r.cost)}</td><td>${esc(timeOf(r.at))}</td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="5">إجمالي توالف اليوم</td><td class="n">${money(dayTotal)}</td><td></td></tr></tfoot></table>`;
  } else {
    h += `<h2 class="pdf-block">التفاصيل اليومية</h2>`;
    if (!days.length) h += `<p>لا توجد توالف مسجلة.</p>`;
    else {
      h += `<table><thead><tr><th>التاريخ</th><th>الصنف</th><th>الكمية</th><th class="n">التكلفة</th></tr></thead><tbody>`;
      for (const d of days) {
        d.items.forEach((i, k) => {
          h += `<tr class="${k === 0 ? 'pdf-day' : ''}"><td>${k === 0 ? esc(fmtShort(d.date)) + ' - ' + esc(fmtDayName(d.date)) : ''}</td><td>${esc(i.item)}</td><td>${esc(fmtQty(i.unit, i.qty))}</td><td class="n">${money(i.cost)}</td></tr>`;
        });
        h += `<tr class="sub"><td colspan="3">إجمالي ${esc(fmtShort(d.date))}</td><td class="n">${money(d.total)}</td></tr>`;
      }
      h += `</tbody><tfoot><tr><td colspan="3">إجمالي الشهر</td><td class="n">${money(total)}</td></tr></tfoot></table>`;
    }
  }
  if (items.length) {
    const active = days.length, top = days.slice().sort((a, b) => b.total - a.total)[0];
    h += `<div class="pdf-divider pdf-block"><span>توالف شهر ${esc(fmtMonth(month))}${esc(upTo)}</span></div>
      <h2 class="pdf-block">جميع الأصناف التالفة خلال الشهر (${items.length} صنف)</h2>
      ${pdfItemBars(items)}
      <h2 class="pdf-block">إجمالي قيمة التوالف</h2>
      <div class="pdf-tot pdf-block">
        <div class="main"><span>إجمالي قيمة التوالف${esc(upTo)}</span><b>${money(total)} ريال</b></div>
        <div><span>متوسط يوم التوالف</span><b>${money(Math.round(active ? total / active : 0))}</b></div>
        <div><span>أعلى يوم</span><b>${top ? `${money(top.total)}` : '0'}</b><span>${top ? esc(fmtShort(top.date)) : ''}</span></div></div>
      ${pdfDayCols(recs, month)}
      <h2 class="pdf-block">أكثر 5 أصناف تالفة (حسب القيمة)</h2>
      ${pdfItemBars(items.slice(0, 5), { top: true })}`;
  }
  h += `<p class="foot pdf-block">برنامج إدارة مبيعات الفروع</p>`;
  return h;
}

async function buildPdf(opts) {
  const day = opts.batch ? opts.batch.date : opts.month.slice(0, 7);
  return buildPdfDoc(pdfHtml(opts), `توالف ${branchLabel()} ${day}.pdf`);
}
async function buildPdfDoc(html, fileName) {
  for (const s of PDF_LIBS) await loadScript(s);
  const el = document.createElement('div');
  el.className = 'pdf'; el.innerHTML = html;
  document.body.appendChild(el);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await Promise.all([...el.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    const SCALE = 2, W_PX = 794, PAGE_PX = Math.round(W_PX * 297 / 210), TOP = 46, BOT = 52;
    const canvas = await window.html2canvas(el, { scale: SCALE, backgroundColor: '#ffffff', useCORS: true, logging: false });
    // نقاط القطع: نهاية كل صف أو عنوان، حتى لا ينقسم صف بين صفحتين
    const top0 = el.getBoundingClientRect().top;
    const cuts = [...el.querySelectorAll('tr, .pdf-block, p')].map(e => Math.round(e.getBoundingClientRect().bottom - top0)).sort((a, b) => a - b);
    const H = el.offsetHeight, pages = [];
    let y = 0;
    while (y < H - 2) {
      const room = PAGE_PX - BOT - (pages.length ? TOP : 0), limit = y + room;
      if (limit >= H) { pages.push([y, H]); break; }
      let cut = 0; for (const c of cuts) if (c > y + 80 && c <= limit) cut = c;
      if (!cut) cut = limit;
      pages.push([y, cut]); y = cut;
    }
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const mmPerPx = 210 / W_PX;
    pages.forEach(([a, b], i) => {
      if (i) pdf.addPage();
      const part = document.createElement('canvas');
      part.width = canvas.width; part.height = Math.ceil((b - a) * SCALE);
      const ctx = part.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, part.width, part.height);
      ctx.drawImage(canvas, 0, a * SCALE, canvas.width, part.height, 0, 0, part.width, part.height);
      pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', 0, (i ? TOP : 0) * mmPerPx, 210, (b - a) * mmPerPx);
      pdf.setFontSize(9); pdf.setTextColor(140);
      pdf.text(`${i + 1} / ${pages.length}`, 105, 290, { align: 'center' });
    });
    const name = fileName.replace(/[\\/:*?"<>|]/g, '-');
    return new File([pdf.output('blob')], name, { type: 'application/pdf' });
  } finally { el.remove(); }
}

// مشاركة الملف: قائمة المشاركة في الجوال (واتساب ثم القروب)، أو تنزيل الملف وفتح القروب في الكمبيوتر
async function sharePdf(file, btn, kind = 'waste') {
  const link = kind === 'sales' ? info.sales_link : info.waste_link, grp = kind === 'sales' ? 'قروب المبيعات' : 'قروب التوالف';
  const text = `${kind === 'sales' ? 'تقرير المبيعات' : 'تقرير البضائع التالفة'} - ${branchLabel()}`;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: text, text }); return; }
    catch (e) {
      if (e.name === 'AbortError') return;
      if (e.name === 'NotAllowedError') { btn.textContent = 'التقرير جاهز، اضغط للإرسال'; return; }
    }
  }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast(link ? `تم تنزيل التقرير. أرفقه في ${grp}` : `تم تنزيل التقرير. أرسله على ${grp}`);
  if (link) setTimeout(() => window.open(link, '_blank', 'noopener'), 700);
}
// يجهّز الملف إن لم يكن جاهزاً ثم يشاركه
async function sharePrepared(btn, build, get = () => W.pdf, set = f => { W.pdf = f; }, kind = 'waste') {
  if (btn.disabled) return;
  let f = get();
  if (!f) {
    const txt = btn.textContent; btn.disabled = true; btn.textContent = 'جارٍ تجهيز التقرير…';
    try { f = await build(); set(f); }
    catch (e) { toast(errMsg(e), 'err'); btn.disabled = false; btn.textContent = txt; return; }
    btn.disabled = false; btn.textContent = txt;
    const st = document.getElementById('pdfState'); if (st && btn.id === 'waShare') st.textContent = 'التقرير جاهز';
  }
  await sharePdf(f, btn, kind);
}

// =====================================================================
//  تقرير المبيعات اليومي (رسالة نصية مختصرة) — يحمل تاريخ يوم المبيعات حتى لو أُرسل في يوم آخر
// =====================================================================
// نص التقرير المختصر (رسالة واتساب) — بتاريخ يوم المبيعات نفسه
function salesReportText(d) {
  const e = map[d]; if (!e) return '';
  const L = [`📊 *تقرير المبيعات اليومي*`, `🏪 *${branchLabel()}*`, `📅 ${fmtLong(d)}`, '━━━━━━━━━━━━',
    `💰 المبيعات: *${money(e.amount)}* ريال`];
  if (info.credit) {
    const col = Number(e.collected) || 0;
    L.push(`💵 التحصيل: *${money(col)}* ريال`);
    if (col) {
      const v = { cash: Number(e.cash) || 0, bank: Number(e.bank) || 0, card: Number(e.card) || 0 };
      for (const k of PAY_KEYS) if (v[k]) L.push(`     • ${PAY_TTL[k]}: ${money(v[k])}`);
      const other = col - paySum(v); if (other > 0.004) L.push(`     • بدون تفصيل: ${money(other)}`);
    }
  }
  if (hasAcc()) {
    const lines = (sp, tot) => { const o = sp || {}; let sum = 0; const r = info.accounts.filter(a => Number(o[a.id])).map(a => { sum += Number(o[a.id]); return `     • ${a.name}: ${money(o[a.id])}`; });
      const oth = r2(Number(tot) - sum); if (oth > 0.004) r.push(`     • أخرى: ${money(oth)}`); return r; };
    L.push('━━━━━━━━━━━━', '🧾 *فواتير الفروع*', ...lines(e.split, e.amount));
    if (info.credit && Number(e.collected)) L.push('💳 *تحصيل الفروع*', ...lines(e.col_split, e.collected));
  }
  return L.join('\n');
}
async function shareSalesReport(d, btn) {
  if (!map[d]) return toast('لا توجد مبيعات مسجلة لهذا اليوم', 'err');
  const text = salesReportText(d);
  // الجوال: قائمة المشاركة ← واتساب ← القروب
  if (navigator.share) {
    try { await navigator.share({ text }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  // الكمبيوتر: نسخ الرسالة ثم فتح القروب للصقها
  let copied = false;
  try { await navigator.clipboard.writeText(text); copied = true; } catch (e) {}
  if (!copied) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { copied = document.execCommand('copy'); } catch (e) {} t.remove(); }
  toast(copied ? 'تم نسخ التقرير. الصقه في قروب المبيعات' : 'تعذّر النسخ تلقائياً', copied ? undefined : 'err');
  if (info.sales_link) setTimeout(() => window.open(info.sales_link, '_blank', 'noopener'), 600);
}

if (!token) fatal('الرابط غير مكتمل', 'اطلب رابط الفرع الصحيح من الإدارة.');
else {
  load();
  // عند الرجوع للصفحة أو بعد منتصف الليل: تحديث التاريخ والإدخالات
  document.addEventListener('visibilitychange', () => { if (!document.hidden && info && step !== 'confirm') load(); });
  setInterval(() => { if (info && todayISO() !== info.today && step === 'form') load(); }, 60000);
  // تحديث كل 5 دقائق حتى يظهر إشعار التأخير في وقته (بدون مقاطعة الكتابة)
  setInterval(() => {
    const ae = document.activeElement;
    if (info && !document.hidden && step === 'form' && W.step === 'form' && !(ae && ae.tagName === 'INPUT')) load();
  }, 300000);
}
