<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>إدخال المبيعات اليومية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 480px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 48px; }
  .head .group { color: var(--muted); font-size: 15px; }
  .head h1 { font-size: 28px; font-weight: 700; }
  .head .today { margin-top: 2px; font-size: 14px; color: var(--muted); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; margin-top: 16px; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; }
  .cal-head h2 { font-size: 18px; }
  .nav { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; }
  .nav:disabled { opacity: .3; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
  .dow { font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 2px; }
  .day {
    aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    font-family: var(--font-head); font-size: 16px; padding: 0; position: relative;
  }
  .day .mk { font-size: 11px; line-height: 1; height: 11px; }
  .day.done { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .day.adm { background: var(--bg); border: 1.5px solid var(--ink); color: var(--ink); }
  .day.pend { background: var(--caramel-soft); border-color: transparent; color: var(--caramel); }
  .day.future { opacity: .35; border-style: dashed; background: transparent; }
  .day.today:not(.sel) { box-shadow: inset 0 0 0 2px var(--ink); }
  .day.sel { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-inline-end: 5px; }

  .sel-date { text-align: center; }
  .sel-date span { display: block; font-size: 14px; color: var(--muted); }
  .sel-date b { font-family: var(--font-head); font-size: 19px; font-weight: 600; }
  .amount-wrap {
    display: flex; align-items: baseline; gap: 8px; margin: 16px 0;
    border: 2px solid var(--line); border-radius: var(--r-lg); padding: 10px 16px; background: var(--bg);
  }
  .amount-wrap:focus-within { border-color: var(--ink); }
  .amount-wrap input {
    flex: 1; min-width: 0; border: none; background: transparent; outline: none;
    font-family: var(--font-head); font-size: 36px; font-weight: 600; text-align: center; direction: ltr;
  }
  .amount-wrap .cur { font-size: 16px; }
  .amt-lbl { display: block; font-weight: 600; margin-top: 14px; }
  .amt-lbl small { font-weight: 400; color: var(--muted); margin-inline-start: 6px; }
  .amt-lbl + .amount-wrap { margin-top: 6px; margin-bottom: 4px; }
  .pay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
  .pay-f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .pay-f input { width: 100%; min-width: 0; border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--bg); padding: 12px 10px; font-size: 20px; font-weight: 700; font-family: var(--font-head, inherit); text-align: center; color: var(--ink); }
  .pay-f input:focus { outline: none; border-color: var(--ink); background: var(--surface); }
  .pay-tot { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; margin-top: 8px; padding: 10px 14px; border-radius: var(--r-md); background: var(--ink); color: var(--on-ink, #fff); }
  .pay-tot span:first-child { font-size: 14px; font-weight: 600; flex: 1; }
  .pay-tot b { font-size: 22px; }
  .pay-tot .cur { font-size: 13px; opacity: .8; }
  .pay-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .pay-sum b { color: var(--ink); }
  .pay-mini { font-size: 11px !important; color: var(--muted); }
  .entry .btn { white-space: nowrap; flex: none; }
  .entry .d b { white-space: nowrap; }
  #corrPay .pay-f input { font-size: 17px; padding: 9px 6px; }
  /* توزيع الفواتير على الفروع */
  .spl { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; background: var(--surface); }
  .spl-h { font-weight: 700; font-size: 14px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
  .spl-h small { font-weight: 400; color: var(--muted); }
  .spl-r { display: grid; grid-template-columns: 1fr 42%; align-items: center; gap: 4px 10px; padding: 5px 0; border-top: 1px dashed var(--line); }
  .spl-r:first-of-type { border-top: 0; }
  .spl-r > span { font-size: 15px; font-weight: 600; }
  .spl-r input { width: 100%; font: inherit; font-size: 18px; font-family: var(--font-head); text-align: center; padding: 8px 6px; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); }
  .spl-r input:focus { outline: none; border-color: var(--ink); background: var(--surface); }
  .spl-r input.bad { border-color: var(--rose); background: var(--rose-soft); }
  .spl-e { grid-column: 1 / -1; font-size: 13px; color: var(--rose); font-weight: 600; }
  .spl-e:empty { display: none; }
  .spl-r.other { background: #FFF1A8; color: #3d3200; border: 0; border-radius: var(--r-sm); padding: 8px 10px; margin-top: 6px; }
  .spl-r.other b { font-family: var(--font-head); font-size: 20px; text-align: center; }
  @media (prefers-color-scheme: dark) { .spl-r.other { background: #5a4a0c; color: #fff4c2; } }
  .spl-sum { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .spl-sum b { color: var(--ink); }
  .entry .spl-mini { font-size: 11px !important; color: var(--muted); }
  .confirm .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .confirm .pair div { background: var(--bg); border-radius: var(--r-md); padding: 10px; }
  .confirm .pair span { display: block; font-size: 13px; color: var(--muted); }
  .confirm .pair b { font-family: var(--font-head); font-size: 24px; }
  .entry .a small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .confirm { text-align: center; }
  .confirm .big { font-family: var(--font-head); font-size: 40px; font-weight: 700; margin: 6px 0; }
  .confirm .warn { font-size: 14px; color: var(--caramel); background: var(--caramel-soft); border-radius: var(--r-sm); padding: 8px 10px; margin: 12px 0 16px; }
  .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }

  .done-box { text-align: center; padding: 8px 0; }
  .tick { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 34px; margin: 0 auto 10px; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }

  .list h2 { font-size: 17px; margin-bottom: 6px; }
  .entry { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
  .entry:first-of-type { border-top: none; }
  .entry .d b { display: block; font-weight: 600; }
  .entry .d small { color: var(--muted); }
  .entry .a { font-family: var(--font-head); font-weight: 600; white-space: nowrap; }
  .by-adm { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--ink); margin-inline-start: 6px; }
  .adm-note { color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; font-size: 14px; margin-top: 10px; }
  .tag { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--caramel-soft); color: var(--caramel); white-space: nowrap; }

  /* ---- الشعار والتبويبات ---- */
  .nm2 { display: inline-flex; flex-direction: column; line-height: 1.25; vertical-align: middle; }
  .nm2 .nm-main { font-weight: inherit; }
  .nm2 .nm-sub { font-size: .62em; font-weight: 500; color: var(--muted); margin-top: 1px; }
  .brand-row { display: flex; align-items: center; gap: 12px; }
  .logo { width: 60px; height: 60px; border-radius: 14px; object-fit: contain; padding: 5px; background: #fff; border: 1px solid var(--line); flex: none; box-shadow: 0 2px 8px rgba(43,30,24,.06); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 4px; margin-top: 16px; }
  .tabs button { border: none; background: transparent; border-radius: 14px; padding: 11px 8px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--on-ink); }
  .tabs svg { width: 20px; height: 20px; flex: none; }

  /* ---- التوالف ---- */
  .w-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .w-head h2 { font-size: 18px; }
  .w-head input { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); }
  .w-search { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg); margin-top: 12px; }
  .w-hint { font-size: 14px; color: var(--muted); margin-top: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 8px 14px; font-size: 15px; }
  .chip small { color: var(--muted); font-size: 12px; margin-inline-start: 4px; }
  .chip.on { background: var(--rose-soft); border-color: var(--rose); color: var(--rose); }
  .chip.on small { color: inherit; }
  .wline { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; margin-top: 10px; background: var(--bg); }
  .chip-row .wline, #chips > .wline { flex: 1 1 100%; margin-top: 0; background: var(--surface); border: 2px solid var(--cc, var(--rose)); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .chip-row .wline .wline-top b { color: var(--cc, var(--ink)); }
  #chips > .wline { margin: 6px 0; }
  .w-sum { margin-top: 14px; border: 1px dashed var(--line); border-radius: var(--r-md); padding: 10px 12px; }
  .w-sum p { font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .w-sum-i { display: flex; justify-content: space-between; gap: 10px; width: 100%; border: none; background: transparent; padding: 6px 0; font: inherit; font-size: 14px; color: var(--ink); text-align: start; border-top: 1px solid var(--line); cursor: pointer; }
  .w-sum-i:first-of-type { border-top: none; }
  .w-sum-i b { white-space: nowrap; }
  .w-sum-i .no { color: var(--rose); font-style: normal; font-size: 12px; }
  .wline-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .wline-top b { font-size: 16px; }
  .wline-top small { color: var(--muted); font-size: 12px; display: block; }
  .wline-top .x { border: none; background: transparent; color: var(--muted); font-size: 24px; width: 38px; height: 38px; line-height: 1; }
  .qty-row { display: flex; align-items: flex-end; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  .qty-box { display: flex; flex-direction: column; gap: 4px; }
  .qty-box > span { font-size: 13px; color: var(--muted); }
  .stepper { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
  .stepper button { width: 46px; height: 48px; border: none; background: var(--surface); font-size: 24px; font-weight: 600; }
  .stepper button:active { background: var(--line); }
  .stepper input, .gram input { height: 48px; text-align: center; font-family: var(--font-head); font-size: 22px; font-weight: 600; outline: none; direction: ltr; background: transparent; }
  .stepper input { width: 64px; border: none; border-inline: 1px solid var(--line); }
  .stepper.kg input { width: 86px; }
  .kg-hint { font-size: 12px; color: var(--muted); }
  .gram input { width: 84px; border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
  .stepper:focus-within, .gram input:focus { border-color: var(--ink); }
  .line-cost { margin-inline-start: auto; text-align: end; }
  .line-cost span { display: block; font-size: 12px; color: var(--muted); }
  .line-cost b { font-family: var(--font-head); font-size: 18px; }
  .w-total { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 4px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .w-total b { font-family: var(--font-head); font-size: 26px; color: var(--rose); }
  a.btn { text-decoration: none; color: inherit; }
  .btn-wa { background: #1E8E4E; color: #fff; }
  .btn-wa:disabled { opacity: .6; }
  .stack { display: grid; gap: 10px; }
  .clist { text-align: start; margin: 12px 0; }
  .clist div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .clist div:first-child { border-top: none; }
  .clist b { font-family: var(--font-head); white-space: nowrap; }
  .rep-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .rep-sum div { background: var(--bg); border-radius: var(--r-md); padding: 10px 12px; }
  .rep-sum span { display: block; font-size: 13px; color: var(--muted); }
  .rep-sum b { font-family: var(--font-head); font-size: 22px; }
  .rep-sum .main b { color: var(--rose); }
  .rep h3 { font-size: 15px; margin: 18px 0 6px; }
  .rank { padding: 7px 0; border-top: 1px solid var(--line); }
  .rank:first-of-type { border-top: none; }
  .rank-top { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
  .rank-top b { font-family: var(--font-head); white-space: nowrap; }
  .rank-top small { color: var(--muted); font-size: 12px; margin-inline-start: 6px; }
  .rank .bar { height: 4px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .rank .bar i { display: block; height: 100%; background: var(--rose); }
  .wday { border-top: 1px solid var(--line); padding: 9px 0; }
  .wday:first-of-type { border-top: none; }
  .wday-h { display: flex; justify-content: space-between; font-weight: 600; }
  .wday-h b { font-family: var(--font-head); }
  .wday-l { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }

  /* ---- قالب تقرير PDF (ألوان ثابتة) ---- */
  .pdf { position: fixed; left: -20000px; top: 0; width: 794px; background: #fff; color: #1d1a17; direction: rtl; padding: 46px 50px 40px; font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; font-size: 14px; line-height: 1.6; }
  .pdf * { color-scheme: light; }
  .pdf-head { display: flex; align-items: center; gap: 16px; border-bottom: 3px solid #A63D52; padding-bottom: 14px; }
  .pdf-head img { width: 78px; height: 78px; object-fit: contain; padding: 6px; background: #fff; border-radius: 14px; border: 1px solid #e3e0dc; flex: none; }
  .pdf-head h1 { font-family: 'Readex Pro', sans-serif; font-size: 24px; margin: 0; color: #1d1a17; }
  .pdf-head p { margin: 0; color: #6d645c; }
  .pdf-head .t { font-size: 17px; color: #A63D52; font-weight: 600; }
  .pdf-head .meta { margin-inline-start: auto; text-align: left; font-size: 12px; color: #6d645c; }
  .pdf-tot { display: flex; gap: 12px; margin: 16px 0 6px; }
  .pdf-tot div { flex: 1; border-radius: 12px; padding: 10px 14px; background: #f4f1ee; }
  .pdf-tot div.main { background: #A63D52; color: #fff; }
  .pdf-tot span { display: block; font-size: 12px; opacity: .8; }
  .pdf-tot b { font-family: 'Readex Pro', sans-serif; font-size: 22px; }
  .pdf h2 { font-family: 'Readex Pro', sans-serif; font-size: 16px; margin: 18px 0 8px; color: #1d1a17; }
  .pdf table { width: 100%; border-collapse: collapse; }
  .pdf th { background: #2B1E18; color: #fff; font-weight: 600; font-size: 13px; padding: 7px 10px; text-align: right; }
  .pdf td { padding: 6px 10px; border-bottom: 1px solid #e8e4e0; text-align: right; }
  .pdf td.n, .pdf th.n { text-align: left; font-family: 'Readex Pro', sans-serif; white-space: nowrap; }
  .pdf tr.sub td { background: #F6DFE3; font-weight: 700; color: #7d2a3b; }
  .pdf tr.pdf-day td { border-top: 2px solid #cfc7bf; }
  .pdf tfoot td { background: #2B1E18; color: #fff; font-weight: 700; }
  .pdf td.n, .pdf th.n { text-align: center !important; }
  .pdf tr.old td { color: #6d645c; }
  .pdf-divider { position: relative; margin: 30px 0 6px; border-top: 3px dashed #A63D52; text-align: center; }
  .pdf-divider span { position: relative; top: -14px; background: #fff; padding: 0 14px; font-family: 'Readex Pro', sans-serif; font-weight: 700; font-size: 16px; color: #A63D52; }
  .pb-list { border: 1px solid #e8e4e0; border-radius: 12px; padding: 4px 12px; }
  .pb-row { display: grid; grid-template-columns: 210px 1fr 92px; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #f0ece8; }
  .pb-row:last-child { border-bottom: none; }
  .pb-lbl b { display: block; font-size: 13px; line-height: 1.35; }
  .pb-lbl small { display: block; font-size: 11px; color: #6d645c; line-height: 1.3; }
  .pb-track { height: 16px; background: #f4f1ee; border-radius: 4px; overflow: hidden; direction: rtl; }
  .pb-track i { display: block; height: 100%; background: #A63D52; border-radius: 4px; }
  .pb-val { text-align: left; }
  .pb-val b { display: block; font-family: 'Readex Pro', sans-serif; font-size: 14px; }
  .pb-val small { font-size: 11px; color: #6d645c; }
  .pb-list.top .pb-row { grid-template-columns: 30px 200px 1fr 92px; padding: 9px 0; }
  .pb-list.top .pb-track { height: 24px; }
  .pb-list.top .pb-track i { background: #2B1E18; }
  .pb-list.top .pb-lbl b { font-size: 14px; }
  .pb-rank { width: 26px; height: 26px; border-radius: 50%; background: #A63D52; color: #fff; display: grid; place-items: center; font-weight: 700; font-family: 'Readex Pro', sans-serif; }
  .pc-wrap { border: 1px solid #e8e4e0; border-radius: 12px; padding: 12px 12px 6px; margin-top: 8px; }
  .pc-cols { display: flex; align-items: flex-end; gap: 3px; height: 190px; direction: ltr; }
  .pc-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .pc-col i { display: block; width: 78%; background: #A63D52; border-radius: 3px 3px 0 0; }
  .pc-v { font-size: 9px; color: #1d1a17; font-family: 'Readex Pro', sans-serif; margin-bottom: 2px; white-space: nowrap; }
  .pc-d { font-size: 10px; color: #6d645c; border-top: 1px solid #cfc7bf; width: 100%; text-align: center; margin-top: 2px; padding-top: 2px; }
  .pc-cap { font-size: 11px; color: #8a8178; text-align: center; margin-top: 4px; }
  .pdf .sr-date { font-size: 17px; font-weight: 700; color: #1d1a17; }
  .sr-cmp div { background: #fff; border: 1px solid #e8e4e0; }
  .sr-cmp b { font-size: 18px; }
  .sr-cmp .up, .sr-cmp .down { display: block !important; margin-top: 2px; }
  .pdf .up { color: #2e7d32; font-weight: 700; font-size: 12px; opacity: 1; display: inline; }
  .pdf .down { color: #b3261e; font-weight: 700; font-size: 12px; opacity: 1; display: inline; }
  .pc-col.cur i { background: #2B1E18; }
  .pc-col.cur .pc-d { color: #2B1E18; font-weight: 700; }
  .pdf .foot { margin-top: 18px; font-size: 11px; color: #8a8178; text-align: center; }

  /* ---- إشعار التأخير ---- */
  .late-box { margin-top: 16px; background: #B3261E; color: #fff; border-radius: var(--r-lg); padding: 16px; box-shadow: 0 6px 18px rgba(179,38,30,.25); }
  .late-top { display: flex; align-items: center; gap: 10px; font-size: 18px; font-family: var(--font-head); }
  .late-ic { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: #B3261E; display: grid; place-items: center; font-weight: 800; flex: none; }
  .late-box p { margin-top: 8px; }
  .late-days { font-family: var(--font-head); font-weight: 600; background: rgba(255,255,255,.14); border-radius: var(--r-sm); padding: 6px 10px; }
  .late-btn { margin-top: 12px; background: #fff; color: #B3261E; font-weight: 700; }
  .late-note { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .resend-box { margin-top: 16px; background: #9a5b00; color: #fff; border-radius: var(--r-lg); padding: 16px; box-shadow: 0 6px 18px rgba(154,91,0,.25); }
  .resend-box .late-ic { color: #9a5b00; font-size: 18px; }
  .rs-item { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.25); }
  .e-acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .e-rep { color: #1f7a3e; border-color: #1f7a3e55; }
  .late-top + .rs-item { border-top: none; padding-top: 0; }
  .rs-note { margin-top: 4px; font-size: 14px; background: rgba(255,255,255,.14); border-radius: var(--r-sm); padding: 6px 10px; }
  .rs-btn { margin-top: 10px; background: #fff; color: #9a5b00; font-weight: 700; }
  /* ---- صنف آخر ---- */
  .chip-other { border-style: dashed; font-weight: 600; }
  #chips { display: block; }
  .chip-group { margin-bottom: 12px; border-radius: 16px; background: color-mix(in srgb, var(--cc) 7%, var(--surface)); border: 1.5px solid color-mix(in srgb, var(--cc) 30%, transparent); overflow: hidden; }
  .chip-cat { display: flex; align-items: center; gap: 8px; width: 100%; border: none; cursor: pointer; text-align: start;
    background: var(--cc); color: #fff; font-family: inherit; font-size: 16px; font-weight: 800; padding: 11px 14px; }
  .chip-cat .cc-name { flex: 1; display: flex; align-items: center; gap: 9px; }
  .chip-cat .cc-name::before { content: ''; width: 10px; height: 10px; border-radius: 3px; background: #fff; opacity: .9; transform: rotate(45deg); flex: none; }
  .chip-cat .cc-n { font-size: 12px; font-weight: 600; background: rgba(255,255,255,.2); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
  .chip-cat .cc-sel { font-size: 12px; font-weight: 700; background: #fff; color: var(--cc); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
  .chip-cat .cc-arr { font-size: 14px; transition: transform .15s; }
  .chip-group.shut .cc-arr { transform: rotate(90deg); }
  .chip-cat:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
  .chip-group .chip { background: var(--surface); border-color: color-mix(in srgb, var(--cc) 28%, var(--line)); }
  .chip-group .chip.on { background: var(--cc); border-color: var(--cc); color: #fff; }
  .chip-group .chip.on small { color: rgba(255,255,255,.85); }
  #chips > .chip { margin: 4px 0 0 6px; }
  .other-form select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font: inherit; }
  .other-form { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; margin-top: 4px; }
  .other-form .field { margin-top: 8px; }
  .other-form .field:first-child { margin-top: 0; }
  .unit-seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 3px; gap: 2px; }
  .unit-seg button { border: none; background: transparent; padding: 8px 16px; border-radius: 9px; font-weight: 500; }
  .unit-seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .other-form .row2 { margin-top: 10px; }

  /* ---- المردود ---- */
  .tabs.three { grid-template-columns: repeat(3, 1fr); }
  .tabs.three button { font-size: 14px; gap: 5px; padding: 10px 4px; }
  .ret-neg { color: #C62828; }
  @media (prefers-color-scheme: dark) { .ret-neg { color: #EF9A9A; } }
  .amount-wrap.ret .sign { font-family: var(--font-head); font-size: 30px; font-weight: 700; color: #C62828; }
  .net-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .net-box div { background: var(--bg); border-radius: var(--r-md); padding: 10px; text-align: center; }
  .net-box span { display: block; font-size: 12px; color: var(--muted); }
  .net-box b { font-family: var(--font-head); font-size: 20px; }
  .net-box .n { background: var(--ink); color: var(--on-ink); }
  .net-box .n span { color: inherit; opacity: .8; }
  .ret-h { font-size: 15px; margin: 16px 0 6px; }
  .ret-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .ret-row small { display: block; font-size: 12px; color: var(--muted); }
  .ret-row small.adm { color: var(--caramel); }
  .ret-row > b { font-size: 17px; white-space: nowrap; }
  .fatal { text-align: center; padding: 40px 16px; }
  .fatal h1 { font-size: 22px; margin-bottom: 8px; }
  .skeleton { height: 340px; border-radius: var(--r-lg); background: var(--surface); margin-top: 16px; opacity: .6; }
</style>
</head>
<body>
<main class="wrap" id="root">
  <div class="skeleton"></div>
</main>

<dialog id="corrDlg">
  <form id="corrForm" method="dialog">
    <h2 style="font-size:20px">طلب تعديل المبلغ</h2>
    <div class="muted" id="corrInfo" style="margin-top:6px"></div>
    <label class="field"><span id="corrAmountLbl">المبلغ الصحيح</span><input id="corrAmount" inputmode="decimal" autocomplete="off" required dir="ltr"></label>
    <div id="corrSpS"></div>
    <div class="field" id="corrColWrap" hidden><span>التحصيل الصحيح</span><div id="corrPay"></div><div id="corrSpC"></div></div>
    <label class="field"><span>ملاحظة للإدارة (اختياري)</span><textarea id="corrNote" rows="2"></textarea></label>
    <p class="err" id="corrErr" role="alert"></p>
    <div class="row2" style="margin-top:6px">
      <button class="btn btn-primary" id="corrSend" value="send" type="submit">إرسال طلب التعديل</button>
      <button class="btn btn-ghost" value="cancel" type="button" id="corrCancel">إلغاء</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const token = new URLSearchParams(location.search).get('t');
const root = document.getElementById('root');
let SPL = { s: {}, c: {} }, CSPL = { s: {}, c: {} };
let info = null, map = {}, viewMonth = null, selected = null, amountStr = '', colStr = '', PAY = { cash: '', bank: '', card: '' }, step = 'form', firstLoad = true, busy = false, lastDone = null;
const DOW = ['أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];

function fatal(title, msg) {
  root.innerHTML = `<div class="fatal"><h1>${esc(title)}</h1><p class="muted">${esc(msg)}</p></div>`;
}

async function load() {
  const { data, error } = await sb.rpc('branch_info', { p_token: token });
  if (error) { fatal('تعذّر فتح صفحة الفرع', errMsg(error)); return; }
  info = data; map = {};
  for (const e of info.entries) map[e.date] = e;
  if (!viewMonth) viewMonth = monthStart(info.today);
  if (selected && map[selected]) selected = null;
  if (firstLoad && !map[info.today]) selected = info.today;
  firstLoad = false;
  document.title = 'مبيعات ' + (info.group_name === info.name ? info.name : info.group_name + ' - ' + info.name);
  render();
}

const ICON_SALES = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>';
const ICON_WASTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/><path d="M10 11v6M14 11v6"/></svg>';
let tab = location.hash === '#waste' ? 'waste' : location.hash === '#returns' ? 'returns' : 'sales';
const ICON_RET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>';

// إشعار التأخير: يظهر من الساعة 9 صباحاً لأي يوم سابق لم تُدخل مبيعاته
function lateBanner() {
  const L = info.late || { missing: [], count: 0 };
  const miss = (L.missing || []).filter(d => !map[d]);
  if (!miss.length) {
    return L.count ? `<p class="late-note">عدد مرات التأخير في الإدخال: <b>${L.count}</b></p>` : '';
  }
  const n = miss.length;
  const days = n === 1 ? 'يوم واحد' : n === 2 ? 'يومين' : n <= 10 ? `${n} أيام` : `${n} يوماً`;
  return `<div class="late-box" role="alert">
    <div class="late-top"><span class="late-ic">!</span><b>إشعار التأخير رقم ${L.count}</b></div>
    <p>تأخرت في إدخال المبيعات. لم تُدخل مبيعات <b>${days}</b>:</p>
    <p class="late-days">${miss.map(d => esc(fmtShort(d))).join('، ')}</p>
    <button class="btn btn-block late-btn" id="lateGo">إدخال المبيعات الآن</button>
  </div>`;
}

// طلب الإدارة بإعادة الإرسال (بعد حذف تقرير يوم)
function resendBanner() {
  const list = (info.resend || []).filter(q => q.kind === 'waste' ? info.waste : !map[q.date]);
  if (!list.length) return '';
  return `<div class="resend-box" role="alert">
    <div class="late-top"><span class="late-ic">↻</span><b>طلب من الإدارة: إعادة الإرسال</b></div>
    ${list.map(q => `<div class="rs-item">
      <p>${q.kind === 'waste' ? 'أعد إرسال <b>البضائع التالفة</b>' : 'أعد إدخال <b>المبيعات</b>'} ليوم <b>${esc(fmtLong(q.date))}</b></p>
      ${q.note ? `<p class="rs-note">ملاحظة الإدارة: ${esc(q.note)}</p>` : ''}
      <button class="btn btn-block rs-btn" data-rs="${q.id}">${q.kind === 'waste' ? 'إعادة إرسال التوالف الآن' : 'إدخال المبيعات الآن'}</button></div>`).join('')}
  </div>`;
}

// الأسماء الطويلة على سطرين: "حلويات مورا - البلد" ← حلويات مورا / (فرع البلد)
// "فرع التوزيع رقم 1 (المندوب صادق النهاري)" ← فرع التوزيع رقم 1 / (المندوب صادق النهاري)
function nameParts(n) {
  n = String(n || '').trim();
  let m = n.match(/^(.+?)\s*\(([^()]+)\)\s*$/);
  if (m) return [m[1].trim(), m[2].trim()];
  m = n.match(/^(.+?)\s+[-–]\s+(.+)$/);
  if (m) return [m[1].trim(), /^فرع\s/.test(m[2]) ? m[2].trim() : 'فرع ' + m[2].trim()];
  return [n, ''];
}
function nameHtml(n) {
  const [a, b] = nameParts(n);
  return b ? `<span class="nm2"><span class="nm-main">${esc(a)}</span><span class="nm-sub">(${esc(b)})</span></span>` : esc(a);
}
function render() {
  const showGroup = info.group_name !== info.name;
  if ((tab === 'waste' && !info.waste) || (tab === 'returns' && !info.credit)) tab = 'sales';
  root.innerHTML = `
    <header class="head brand-row">
      ${info.logo ? `<img class="logo" src="${esc(info.logo)}" alt="">` : ''}
      <div>
        ${showGroup ? `<p class="group">${esc(info.group_name)}</p>` : ''}
        <h1>${nameHtml(info.name)}</h1>
        <p class="today">اليوم ${esc(fmtLong(info.today))}</p>
      </div>
    </header>
    ${resendBanner()}
    ${lateBanner()}
    ${info.waste || info.credit ? `<nav class="tabs${info.waste && info.credit ? ' three' : ''}" role="tablist">
      <button role="tab" data-tab="sales" aria-selected="${tab === 'sales'}">${ICON_SALES}المبيعات</button>
      ${info.credit ? `<button role="tab" data-tab="returns" aria-selected="${tab === 'returns'}">${ICON_RET}المردود</button>` : ''}
      ${info.waste ? `<button role="tab" data-tab="waste" aria-selected="${tab === 'waste'}">${ICON_WASTE}البضائع التالفة</button>` : ''}
    </nav>` : ''}
    ${tab === 'sales' ? `
    <section class="panel" id="cal"></section>
    <section class="panel" id="form"></section>
    <section class="panel list" id="list"></section>` : tab === 'returns' ? `
    <section class="panel" id="rform"></section>
    <section class="panel rep" id="rrep"></section>` : `
    <section class="panel" id="wform"></section>
    <section class="panel rep" id="wrep"></section>`}`;
  const lg = root.querySelector('#lateGo');
  if (lg) lg.onclick = () => {
    tab = 'sales'; history.replaceState(null, '', location.pathname + location.search);
    selected = info.late.missing.find(d => !map[d]) || info.late.missing[0]; viewMonth = monthStart(selected); step = 'form'; render();
    const f = document.getElementById('form'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  root.querySelectorAll('[data-rs]').forEach(b => b.onclick = () => {
    const q = (info.resend || []).find(x => String(x.id) === b.dataset.rs); if (!q) return;
    if (q.kind === 'waste') {
      tab = 'waste'; history.replaceState(null, '', '#waste');
      W.date = q.date; W.step = 'form'; W.month = monthStart(q.date); W.loaded = false; render();
      const f = document.getElementById('wform'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      tab = 'sales'; history.replaceState(null, '', location.pathname + location.search);
      selected = q.date; viewMonth = monthStart(q.date); step = 'form'; render();
      const f = document.getElementById('form'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
  root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    tab = b.dataset.tab; history.replaceState(null, '', tab === 'sales' ? location.pathname + location.search : '#' + tab);
    render(); scrollTo({ top: 0 });
  });
  if (tab === 'sales') { renderCal(); renderForm(); renderList(); }
  else if (tab === 'returns') { renderRForm(); renderRRep(); if (!RT.loaded && !RT.loading) loadReturns(); }
  else { renderWForm(); renderWRep(); if (!W.loaded && !W.loading) loadWaste(); }
}

// =====================================================================
//  مردود المبيعات (الفروع الآجلة) — المبلغ يُخصم من الإجمالي ولا يغيّر المبيعات المسجلة
// =====================================================================
const RT = { date: null, amt: '', note: '', step: 'form', month: null, list: [], loaded: false, loading: false };
const neg = n => '\u2066−' + money(n) + '\u2069';
function renderRForm() {
  const el = document.getElementById('rform'); if (!el) return;
  if (!RT.date) RT.date = info.today;
  if (RT.step === 'confirm') {
    const a = parseAmount(RT.amt);
    el.innerHTML = `<div class="confirm">
      <p class="muted">راجع قبل التسجيل</p>
      <p style="font-weight:600;margin-top:6px">${esc(fmtLong(RT.date))}</p>
      <p class="big num ret-neg">${neg(a)} <span class="cur">ريال</span></p>
      ${RT.note.trim() ? `<p class="muted">${esc(RT.note.trim())}</p>` : ''}
      <p class="warn">يُخصم المردود من إجمالي المبيعات ولا يغيّر المبيعات المسجلة. لا يمكن تعديله بعد التسجيل، وللتصحيح تواصل مع الإدارة.</p>
      <div class="row2"><button class="btn btn-accent btn-lg" id="rSend">تأكيد التسجيل</button><button class="btn btn-ghost btn-lg" id="rBack">رجوع</button></div></div>`;
    el.querySelector('#rBack').onclick = () => { RT.step = 'form'; renderRForm(); };
    el.querySelector('#rSend').onclick = submitReturn;
    return;
  }
  el.innerHTML = `<div class="w-head"><h2>إضافة مردود مبيعات</h2>
      <label class="muted" style="font-size:14px">التاريخ <input type="date" id="rDate" max="${info.today}" value="${RT.date}"></label></div>
    <label class="amt-lbl" for="rAmt">مبلغ المردود <small>(يُخصم من المبيعات)</small></label>
    <label class="amount-wrap ret"><span class="sign">−</span><input id="rAmt" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(RT.amt)}"><span class="cur">ريال</span></label>
    <label class="field" style="margin-top:10px"><span>ملاحظة (اختياري)</span><input id="rNote" maxlength="120" autocomplete="off" value="${esc(RT.note)}" placeholder="مثال: بضاعة مرتجعة من العميل"></label>
    <p class="err" id="rErr" role="alert"></p>
    <button class="btn btn-primary btn-block btn-lg" id="rNext" style="margin-top:10px">تسجيل المردود</button>`;
  el.querySelector('#rDate').onchange = e => { RT.date = e.target.value; };
  const a = el.querySelector('#rAmt'), n = el.querySelector('#rNote');
  a.oninput = () => { RT.amt = a.value; el.querySelector('#rErr').textContent = ''; };
  n.oninput = () => { RT.note = n.value; };
  a.onkeydown = e => { if (e.key === 'Enter') el.querySelector('#rNext').click(); };
  el.querySelector('#rNext').onclick = () => {
    const err = el.querySelector('#rErr'), v = parseAmount(RT.amt);
    RT.date = el.querySelector('#rDate').value;
    if (!RT.date) { err.textContent = 'اختر التاريخ'; return; }
    if (RT.date > info.today) { err.textContent = 'لا يمكن الإدخال لتاريخ لم يأتِ بعد'; return; }
    if (isNaN(v) || v <= 0) { err.textContent = 'اكتب مبلغ المردود رقماً أكبر من صفر'; a.focus(); return; }
    RT.step = 'confirm'; renderRForm();
  };
}
async function submitReturn() {
  if (busy) return; busy = true;
  const b = document.getElementById('rSend'); b.disabled = true; b.textContent = 'جارٍ التسجيل…';
  const { error } = await sb.rpc('submit_return', { p_token: token, p_date: RT.date, p_amount: parseAmount(RT.amt), p_note: RT.note });
  busy = false;
  if (error) { toast(errMsg(error), 'err'); RT.step = 'form'; renderRForm(); return; }
  toast(`تم تسجيل مردود بمبلغ ${money(parseAmount(RT.amt))} ريال`);
  RT.month = monthStart(RT.date); RT.amt = ''; RT.note = ''; RT.step = 'form'; RT.date = info.today;
  renderRForm(); await loadReturns();
}
async function loadReturns() {
  if (!RT.month) RT.month = monthStart(info.today);
  RT.loading = true; const m = RT.month;
  const { data, error } = await sb.rpc('branch_returns', { p_token: token, p_from: m, p_to: monthEnd(m) });
  RT.loading = false;
  if (m !== RT.month) return;
  if (error) { toast(errMsg(error), 'err'); return; }
  RT.list = data || []; RT.loaded = true; renderRRep();
}
function renderRRep() {
  const el = document.getElementById('rrep'); if (!el) return;
  if (!RT.month) RT.month = monthStart(info.today);
  const m = RT.month, atCur = m >= monthStart(info.today);
  const sales = (info.entries || []).filter(e => e.date >= m && e.date <= monthEnd(m)).reduce((a, e) => a + Number(e.amount), 0);
  const ret = RT.list.reduce((a, r) => a + Number(r.amount), 0);
  el.innerHTML = `<div class="cal-head"><button class="nav" id="rPrev" aria-label="الشهر السابق">›</button>
      <h2>المبيعات والمردود: ${esc(fmtMonth(m))}</h2>
      <button class="nav" id="rNextM" aria-label="الشهر التالي" ${atCur ? 'disabled' : ''}>‹</button></div>
    ${!RT.loaded ? '<p class="muted" style="margin-top:12px">جارٍ التحميل…</p>' : `
    <div class="net-box">
      <div><span>إجمالي المبيعات</span><b class="num">${money(sales)}</b></div>
      <div class="r"><span>مردود المبيعات</span><b class="num ret-neg">${ret ? neg(ret) : '0'}</b></div>
      <div class="n"><span>صافي المبيعات</span><b class="num">${money(sales - ret)}</b></div>
    </div>
    <h3 class="ret-h">مردود المبيعات (${RT.list.length})</h3>
    ${RT.list.length ? RT.list.map(r => `<div class="ret-row"><div><b>${esc(fmtShort(r.date))}</b> <span class="muted">${esc(fmtDayName(r.date))}</span>
        ${r.note ? `<small>${esc(r.note)}</small>` : ''}${r.by === 'admin' ? '<small class="adm">أدخلته الإدارة</small>' : ''}</div>
        <b class="num ret-neg">${neg(r.amount)}</b></div>`).join('')
      : '<p class="muted" style="font-size:14px">لا يوجد مردود في هذا الشهر.</p>'}`}`;
  el.querySelector('#rPrev').onclick = () => { RT.month = addMonths(RT.month, -1); RT.loaded = false; renderRRep(); loadReturns(); };
  el.querySelector('#rNextM').onclick = () => { RT.month = addMonths(RT.month, 1); RT.loaded = false; renderRRep(); loadReturns(); };
}

function renderCal() {
  const el = document.getElementById('cal');
  const start = viewMonth, end = monthEnd(viewMonth), today = info.today;
  const lead = parseISO(start).getUTCDay();
  let cells = DOW.map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += '<div></div>';
  for (const d of daysRange(start, end)) {
    const e = map[d], fut = d > today;
    const cls = ['day', e ? (e.pending ? 'pend' : e.by === 'admin' ? 'adm' : 'done') : '', fut ? 'future' : '', d === today ? 'today' : '', d === selected ? 'sel' : ''].join(' ');
    const stateTxt = e ? `مُدخل ${e.by === 'admin' ? 'من قبل الإدارة ' : ''}${money(e.amount)} ريال${info.credit ? `، التحصيل ${money(e.collected)} ريال` : ''}` : fut ? 'لم يأتِ بعد' : 'متاح للإدخال';
    cells += `<button type="button" class="${cls}" data-d="${d}" ${fut ? 'disabled' : ''} aria-label="${esc(fmtLong(d))}، ${stateTxt}">
      <span>${Number(d.slice(8))}</span><span class="mk">${e ? (e.pending ? '•' : '✓') : ''}</span></button>`;
  }
  const atCurrent = viewMonth >= monthStart(today);
  el.innerHTML = `
    <div class="cal-head">
      <button class="nav" id="prevM" aria-label="الشهر السابق">›</button>
      <h2>${esc(fmtMonth(viewMonth))}</h2>
      <button class="nav" id="nextM" aria-label="الشهر التالي" ${atCurrent ? 'disabled' : ''}>‹</button>
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="legend">
      <span><i style="background:var(--accent-soft)"></i>تم الإدخال</span>
      <span><i style="background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--ink)"></i>أدخلته الإدارة</span>
      <span><i style="background:var(--caramel-soft)"></i>تعديل قيد المراجعة</span>
      <span><i style="box-shadow:inset 0 0 0 1px var(--line)"></i>متاح</span>
    </div>`;
  el.querySelector('#prevM').onclick = () => { viewMonth = addMonths(viewMonth, -1); renderCal(); };
  el.querySelector('#nextM').onclick = () => { viewMonth = addMonths(viewMonth, 1); renderCal(); };
  el.querySelectorAll('.day').forEach(b => b.onclick = () => {
    const d = b.dataset.d;
    if (map[d]) { openCorr(d); return; }
    selected = d; step = 'form';
    renderCal(); renderForm();
    const inp = document.getElementById('amount'); if (inp) inp.focus();
  });
}

      <p class="warn">بعد الإرسال لا يمكن إدخال هذا التاريخ مرة أخرى، والتصحيح يكون بطلب تعديل للإدارة.</p>

    <label class="amount-wrap"><span class="sr">${info.credit ? 'المبيعات الآجلة' : 'إجمالي المبيعات'}</span>

// ---------- التحصيل: نقدي + تحويل بنكي + شبكة ----------
const PAY_KEYS = ['cash', 'bank', 'card'], PAY_LBL = { cash: 'النقدي', bank: 'التحويل البنكي', card: 'الشبكة' };
const PAY_TTL = { cash: 'نقدي', bank: 'تحويل بنكي', card: 'شبكة' };
const payNum = v => String(v ?? '').trim() === '' ? 0 : parseAmount(v);
function payVals(o = PAY) { const r = {}; for (const k of PAY_KEYS) r[k] = payNum(o[k]); return r; }
const paySum = v => PAY_KEYS.reduce((a, k) => a + (isNaN(v[k]) ? 0 : v[k]), 0);
function colValue() { return paySum(payVals()); }
function payFields(pre, o) {
  return `<div class="pay-grid">${PAY_KEYS.map(k => `<label class="pay-f"><span>${PAY_TTL[k]}</span>
      <input id="${pre}-${k}" inputmode="decimal" autocomplete="off" placeholder="0" dir="ltr" value="${esc(o[k])}"></label>`).join('')}</div>
    <div class="pay-tot"><span>مجموع التحصيل</span><b class="num" id="${pre}-tot">${money(paySum(payVals(o)))}</b><span class="cur">ريال</span></div>`;
}
function bindPay(root, pre, o, onChange, onEnter) {
  PAY_KEYS.forEach((k, i) => {
    const f = root.querySelector(`#${pre}-${k}`);
    f.oninput = () => { o[k] = f.value; root.querySelector(`#${pre}-tot`).textContent = money(paySum(payVals(o))); onChange && onChange(); };
    f.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const nx = PAY_KEYS[i + 1]; nx ? root.querySelector(`#${pre}-${nx}`).focus() : onEnter && onEnter(); } };
  });
}
function payLine(v) { return PAY_KEYS.filter(k => v[k]).map(k => `<span>${PAY_TTL[k]} <b class="num">${money(v[k])}</b></span>`).join('') || '<span class="muted">—</span>'; }
function entryPay(e) {
  const v = { cash: Number(e.cash) || 0, bank: Number(e.bank) || 0, card: Number(e.card) || 0 };
  const other = Math.round((Number(e.collected) - paySum(v)) * 100) / 100;
  return PAY_KEYS.filter(k => v[k]).map(k => `${PAY_TTL[k]} ${money(v[k])}`).concat(other > 0 ? [`بدون تفصيل ${money(other)}`] : []).join(' · ');
}

// ---------- توزيع الفواتير والتحصيل على الفروع ----------
const hasAcc = () => !!(info && info.accounts && info.accounts.length);
function splitHtml(pre, o, title, sub) {
  return `<div class="spl" id="${pre}-spl"><div class="spl-h"><span>${title}</span><small>${sub}</small></div>
    ${info.accounts.map(a => `<label class="spl-r"><span>${esc(a.name)}</span>
      <input id="${pre}-a${a.id}" data-acc="${a.id}" inputmode="decimal" autocomplete="off" placeholder="0" dir="ltr" value="${esc(o[a.id] || '')}">
      <small class="spl-e" id="${pre}-e${a.id}" role="alert"></small></label>`).join('')}
    <div class="spl-r other" aria-live="polite"><span>أخرى <small style="font-weight:400">(المتبقي تلقائياً)</small></span><b class="num" id="${pre}-oth">0</b></div>
    <small class="spl-e" id="${pre}-err" role="alert"></small></div>`;
}
// يحسب "أخرى" ويعرض الحد الأقصى عند التجاوز. يرجع { ok, vals, other, msg }
function splitCalc(root, pre, total, o, what) {
  const vals = {}; let sum = 0, bad = null;
  for (const a of info.accounts) { const v = payNum(o[a.id]); vals[a.id] = v; if (isNaN(v) || v < 0) bad = bad || a; else sum += v; }
  const t = isNaN(total) ? 0 : total, other = r2(t - sum), over = other < -0.004;
  const q = id => root && root.querySelector('#' + id);
  for (const a of info.accounts) {
    const inp = q(`${pre}-a${a.id}`), er = q(`${pre}-e${a.id}`); if (!inp) continue;
    let m = '';
    if (bad === a) m = 'اكتب المبلغ رقماً فقط';
    else if (over && String(o._last) === String(a.id)) m = `الحد الأقصى لهذه الفاتورة هو ${money(Math.max(0, r2(t - (sum - vals[a.id]))))} ريال ليطابق إجمالي ${what}`;
    inp.classList.toggle('bad', !!m); er.textContent = m;
  }
  const oth = q(`${pre}-oth`); if (oth) oth.textContent = money(Math.max(0, other));
  const ge = q(`${pre}-err`);
  const lastOk = info.accounts.some(a => String(o._last) === String(a.id));
  const msg = bad ? `اكتب مبلغ ${bad.name} رقماً فقط` : over ? `مجموع مبالغ الفروع (${money(sum)}) أكبر من إجمالي ${what} (${money(t)}). الحد الأقصى ${money(t)} ريال` : '';
  if (ge) ge.textContent = over && !lastOk ? msg : '';
  return { ok: !msg, vals, other: Math.max(0, other), msg };
}
function bindSplit(root, pre, o, getTotal, what, onEnter) {
  const ins = info.accounts.map(a => root.querySelector(`#${pre}-a${a.id}`));
  ins.forEach((f, i) => {
    f.oninput = () => { o[f.dataset.acc] = f.value; o._last = f.dataset.acc; splitCalc(root, pre, getTotal(), o, what); };
    f.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); ins[i + 1] ? ins[i + 1].focus() : onEnter && onEnter(); } };
  });
  splitCalc(root, pre, getTotal(), o, what);
}
const splitArg = vals => { const r = {}; for (const k in vals) if (vals[k] > 0) r[k] = r2(vals[k]); return r; };
function splitText(split, total) { // سطر مختصر: مورا البلد 300 · ... · أخرى 200
  if (!hasAcc()) return '';
  const sp = split || {}; let sum = 0;
  const parts = info.accounts.filter(a => Number(sp[a.id])).map(a => { sum += Number(sp[a.id]); return `${a.name} ${money(sp[a.id])}`; });
  const oth = r2(Number(total) - sum); if (oth > 0.004) parts.push(`أخرى ${money(oth)}`);
  return parts.join(' · ');
}
function splitObj(sp) { const o = {}; if (sp) for (const k in sp) o[k] = String(Number(sp[k])); return o; }

async function submit() {
  if (busy) return; busy = true;
  const btn = document.getElementById('sendBtn'); btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
  const amt = parseAmount(amountStr), col = info.credit ? colValue() : 0, pv = payVals();
  const args = { p_token: token, p_date: selected, p_amount: amt, p_collected: col };
  if (info.credit) { args.p_cash = pv.cash; args.p_bank = pv.bank; args.p_card = pv.card; }
  if (hasAcc()) { args.p_split = splitArg(splitCalc(null, 'sp', amt, SPL.s, '').vals); if (info.credit) args.p_col_split = splitArg(splitCalc(null, 'sc', col, SPL.c, '').vals); }
  const { error } = await sb.rpc('submit_sale', args);
  busy = false;
  if (error) { toast(errMsg(error), 'err'); step = 'form'; await load(); return; }
  lastDone = { date: selected, amount: amt, collected: col, pay: pv };
  selected = null; amountStr = ''; colStr = ''; PAY = { cash: '', bank: '', card: '' }; SPL = { s: {}, c: {} }; step = 'done';
  await load();
}

  const el = document.getElementById('list');

  if (!items.length) { el.innerHTML = `<h2>إدخالاتك السابقة</h2><p class="muted">لا توجد إدخالات بعد. أول إدخال سيظهر هنا.</p>`; return; }

    <div class="entry">

      <div class="a num">${money(e.amount)}${info.credit ? `<small>تحصيل ${money(e.collected)}</small>${Number(e.collected) ? `<small class="pay-mini">${esc(entryPay(e))}</small>` : ''}` : ''}${hasAcc() && e.split ? `<small class="spl-mini">${esc(splitText(e.split, e.amount))}</small>` : ''}</div>

      ${e.pending ? `<span class="tag">التعديل قيد المراجعة</span>` : `<button class="btn btn-ghost btn-sm" data-c="${e.date}">طلب تعديل</button>`}</div>
